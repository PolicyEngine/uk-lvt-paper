# Input manifest for the local-authority land value work in uk_lvt/land/.
#
# Every external input the method uses is listed here, including inputs that
# have not been fetched yet, so the gaps are visible. `python -m
# uk_lvt.land.fetch` downloads each `pinned` source into the git-ignored cache
# (.cache/land/ by default) and refuses any file whose sha256 differs from the
# value recorded here. Raw inputs are never committed; only the small derived
# tables in uk_lvt/land/data/ are (see data/derived_manifest.json).
#
# status:
#   pinned       - downloaded once; `sha256` and `bytes` are of that copy.
#   not_fetched  - URL (or landing page) known; no copy taken, so no hash yet.
#   request      - no public file; the data has to be requested from the owner.
#
# retrieved_utc: when the pinned copy was downloaded (file mtime, UTC).
# remote_check: how the live URL was checked against the pinned copy on
#   2026-10-06 without re-downloading it (HTTP HEAD only).
#
# Dropped input: BCIS rebuild costs (commercial licence; outputs must stay
# open), so it is deliberately not listed.

schema_version: 1
default_cache_dir: .cache/land

