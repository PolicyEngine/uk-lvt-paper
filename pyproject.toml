[project]
name = "uk-lvt-paper"
version = "0.1.0"
description = "Replacing council tax with a revenue-neutral land value tax in the UK: PolicyEngine microsimulation"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib",
]

[project.optional-dependencies]
simulation = [
    "policyengine>=4.4.0",
    "policyengine-uk>=2.88.10",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
uk-lvt-build = "uk_lvt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uk_lvt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
