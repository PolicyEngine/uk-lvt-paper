[project]
name = "uk-lvt-paper"
version = "0.1.0"
description = "Replacing council tax with a revenue-neutral land value tax in the UK: PolicyEngine microsimulation"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib",
]

[project.optional-dependencies]
# Exact pins for the model behind results/*.json. uv.lock pins everything
# else; install with `uv sync --frozen --extra simulation`.
simulation = [
    "policyengine-uk==2.89.4",
    "policyengine-core==3.30.3",
]
land = [
    "duckdb>=1.4,<2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "odfpy>=1.4",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
]

[project.scripts]
uk-lvt-build = "uk_lvt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uk_lvt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
